name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and installer integration tests
        env:
          PYTHONPATH: plugin
        run: python -m unittest discover -s tests -v
      - name: Compile Python files
        run: python -m compileall -q install.py plugin
